<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코딩하루 보드</title>
<style>
  :root { --bg:#fbfaf8; --card:#ffffff; --line:#ece6dc; --text:#2a2622; --muted:#8a8278; --accent:#7a4fd6; --accent-soft:#f4efff; --red:#d9534f; --green:#1f8a3b; --amber:#a26400; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#eceae6; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; color:var(--text); -webkit-text-size-adjust:100%; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px; }
  .view { display:none; padding:14px 16px 20px; }
  .view.on { display:block; }
  .hello { font-size:13px; color:var(--muted); margin:6px 0 2px; }
  .big { font-size:22px; font-weight:800; margin:0 0 10px; line-height:1.35; }
  .intro { font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 12px; }
  .prog { height:8px; background:#ece6f7; border-radius:4px; overflow:hidden; margin:2px 0 14px; }
  .prog b { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .day { font-size:12px; font-weight:700; color:var(--muted); margin:16px 0 6px; }
  .task { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .task .ck { width:24px; height:24px; border-radius:8px; border:2px solid #cfc6ba; flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
  .task.done .ck { background:var(--accent); border-color:var(--accent); }
  .task.done .tt { text-decoration:line-through; color:#aaa; }
  .tt { font-size:15px; font-weight:700; line-height:1.4; }
  .tm { font-size:12px; color:var(--muted); margin-top:3px; }
  .tm.need { color:#c2410c; font-weight:700; }
  .chip { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-right:4px; }
  .c-스레드 { background:#111; color:#fff; } .c-인스타 { background:#fde4ef; color:#c2185b; } .c-네이버 { background:#e3f6e8; color:var(--green); } .c-이번 { background:#fff1d6; color:var(--amber); }
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px; height:68px; background:#fff; border-top:1px solid var(--line); display:flex; justify-content:space-around; align-items:center; padding-bottom:env(safe-area-inset-bottom); z-index:10; }
  .tabbar button { background:none; border:none; font-size:12px; color:#999; display:flex; flex-direction:column; align-items:center; gap:3px; font-family:inherit; }
  .tabbar button i { font-style:normal; font-size:20px; }
  .tabbar button.on { color:var(--accent); font-weight:700; }
  /* detail */
  .sheet { position:fixed; inset:0; background:var(--bg); z-index:20; overflow:auto; display:none; }
  .sheet.on { display:block; }
  .sheet .inner { max-width:560px; margin:0 auto; padding:14px 16px 110px; }
  .back { font-size:14px; color:var(--accent); background:none; border:none; padding:6px 0; font-family:inherit; }
  .tip { background:var(--accent-soft); border-radius:12px; padding:10px 12px; font-size:13px; color:#4b2f9e; line-height:1.55; margin:10px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .draft { font-size:15px; line-height:1.75; white-space:pre-wrap; word-break:keep-all; }
  .fill { display:block; width:100%; background:#fff7e6; border:1.5px dashed #f0b44c; border-radius:10px; padding:9px 10px; margin:6px 0; font-size:14px; line-height:1.5; color:#5a3b00; font-family:inherit; resize:vertical; min-height:44px; }
  .fill.ok { background:#eef9f0; border:1.5px solid #6cc07f; color:#1f4b2b; }
  .fill::placeholder { color:#b98a3a; }
  .opt { font-size:11px; color:var(--muted); margin-top:-2px; }
  .count { font-size:12px; color:var(--muted); margin-top:8px; text-align:right; }
  .count.over { color:var(--red); font-weight:700; }
  .actions { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px; background:#fff; border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:21; }
  .btn { flex:1; text-align:center; padding:13px 0; border-radius:12px; font-size:15px; font-weight:700; border:none; font-family:inherit; }
  .btn.p { background:var(--accent); color:#fff; } .btn.s { background:#f1ede7; color:#4a443d; }
  .refs summary { font-size:13px; color:var(--accent); cursor:pointer; margin:8px 0; }
  /* learn */
  .sec { font-size:16px; font-weight:800; margin:20px 0 8px; }
  .stat { display:flex; gap:8px; margin:6px 0 4px; }
  .stat div { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center; font-size:11px; color:var(--muted); }
  .stat b { display:block; font-size:17px; color:var(--text); }
  .rep li { font-size:13px; line-height:1.6; margin-bottom:6px; }
  .rep b { color:#5b3fb0; }
  .tech { background:#fff; border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px; }
  .tech h4 { margin:0 0 4px; font-size:15px; }
  .tech .ex { font-size:13px; color:#5f584f; line-height:1.6; }
  .tech .ours { margin-top:8px; background:var(--accent-soft); border-radius:10px; padding:9px 11px; font-size:14px; color:#3f2a8a; line-height:1.55; }
  .tech .use { font-size:12px; color:var(--muted); margin-top:6px; }
  .tech.dont { border-color:#f3d4d2; }
  .tech.dont h4 { color:var(--red); }
  .ref { border-top:1px solid var(--line); padding:10px 0 4px; margin-top:8px; font-size:13px; line-height:1.55; }
  .ref .who { font-size:12px; color:var(--muted); }
  .ref ul { margin:4px 0; padding-left:18px; }
  .ref .k { color:#a26400; font-weight:700; }
  .search { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px; font-size:14px; font-family:inherit; background:#fff; margin-bottom:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chips button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font-size:12px; font-family:inherit; color:#5f584f; }
  .chips button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .post { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:8px; }
  .post .h { font-size:14px; font-weight:700; line-height:1.45; }
  .post .who { font-size:12px; color:var(--muted); margin-top:2px; }
  .post details summary { font-size:12px; color:var(--accent); margin-top:6px; cursor:pointer; }
  .post .body { font-size:13px; line-height:1.6; margin-top:6px; }
  .post .body ul { margin:4px 0; padding-left:18px; }
  .post .body .k { color:#a26400; font-weight:700; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#2a2622; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; z-index:30; pointer-events:none; }
  .toast.on { opacity:1; }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:30px 0; }
  .upd { font-size:11px; color:#a39a8f; text-align:center; margin-top:18px; }
</style>
</head>
<body>
<div class="app">
  <section class="view on" id="v-week">
    <div class="hello" id="hello">원장님, 좋은 하루예요 :)</div>
    <div class="big" id="weekHead">이번 주</div>
    <div class="prog"><b id="progBar" style="width:0"></b></div>
    <p class="intro" id="weekIntro"></p>
    <div id="taskList"></div>
    <div class="upd" id="upd"></div>
  </section>

  <section class="view" id="v-learn">
    <div class="big">배우기</div>
    <div id="summary"></div>
    <div class="sec">잘 통하는 기법</div>
    <div id="techList"></div>
    <div class="sec">하지 말 것</div>
    <div id="dontList"></div>
    <div class="sec">참고 글 전체 <span id="postCount" style="font-size:12px;color:var(--muted);font-weight:500"></span></div>
    <input class="search" id="q" placeholder="검색 (예: 질문, 스크래치, 학부모)">
    <div class="chips" id="typeChips"></div>
    <div id="postList"></div>
  </section>

  <nav class="tabbar">
    <button class="on" data-v="v-week"><i>📅</i>이번 주</button>
    <button data-v="v-learn"><i>💡</i>배우기</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="actions" id="actions" style="display:none"></div>
<div class="toast" id="toast"></div>


<style>
  :root { --card:#fff; --line:#ece6dc; --text:#2a2622; --muted:#8a8278; --red:#d9534f; --bg:#fbfaf8; }
  #gate button.primary { background:#7a4fd6; color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:700; }
  #gate input[type=password] { background:#faf8f5; color:#2a2622; }
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:99; }
  #gate form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:320px; display:flex; flex-direction:column; gap:12px; }
  #gate h1 { font-size:16px; margin:0; }
  #gate input { background:#141720; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  #gate .err { color:var(--red); font-size:12px; min-height:16px; }
</style>
<div id="gate"><form id="gateForm"><h1>대시보드 잠금</h1><input type="password" id="pw" placeholder="비밀번호" autofocus autocomplete="current-password"><label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="remember" checked> 이 기기에서 기억</label><div class="err" id="gateErr"></div><button class="primary" type="submit">열기</button></form></div>
<script>
(async function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pw, enc) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(enc.iv) }, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const enc = await (await fetch('data.enc.json?ts=' + Date.now(), { cache:'no-store' })).json();
  const form = document.getElementById('gateForm'), err = document.getElementById('gateErr');
  async function tryUnlock(pw, remember) {
    try {
      window.IG_DATA = await decrypt(pw, enc);
      if (remember) localStorage.setItem('edu-board-pw', pw); else localStorage.removeItem('edu-board-pw');
      document.getElementById('gate').remove();
      window.bootDashboard();
      return true;
    } catch (e) { return false; }
  }
  const saved = localStorage.getItem('edu-board-pw');
  if (saved && await tryUnlock(saved, true)) return;
  form.onsubmit = async ev => { ev.preventDefault(); err.textContent = ''; const ok = await tryUnlock(document.getElementById('pw').value, document.getElementById('remember').checked); if (!ok) err.textContent = '비밀번호가 맞지 않아요'; };
})();
</script>
<script>
window.bootDashboard = function () {
  const DATA = window.IG_DATA || {};
  const K = 'edu-board-v2-';
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(K + k) || '') ?? d; } catch (e) { return d; } };
  const save = (k, v) => localStorage.setItem(K + k, JSON.stringify(v));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const posts = DATA.posts || [];
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  const pack = (DATA.packs || [])[0];
  let done = load('done', {}), fills = load('fills', {});
  const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1600); };

  // --- fill helpers: {{라벨}} = required, {{선택: 라벨}} = optional
  const FILL = /\{\{([^}]+)\}\}/g;
  const slots = body => [...body.matchAll(FILL)].map((m, i) => ({ i, label: m[1].trim(), optional: /^선택\s*[:：]/.test(m[1].trim()) }));
  const val = (id, i) => ((fills[id] || {})[i] || '').trim();
  const missing = it => slots(it.body).filter(s => !s.optional && !val(it.id, s.i)).length;
  const finalText = it => {
    let i = -1;
    return it.body.replace(FILL, () => { i++; return val(it.id, i) || '\u0000'; })
      .split('\n').filter(line => !line.includes('\u0000')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  };
  const chipCls = ch => 'c-' + String(ch || '').split(' ')[0];

  // --- week view
  function renderWeek() {
    const h = new Date().getHours();
    document.getElementById('hello').textContent = (h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '오늘도 수고 많으셨어요') + ', 원장님 :)';
    if (!pack) { document.getElementById('taskList').innerHTML = '<div class="empty">이번 주 글이 아직 없어요. 월요일 아침에 올라와요.</div>'; return; }
    const DAYS = ['월','화','수','목','금','토','일'];
    const dayRank = w => { const i = DAYS.findIndex(d => (w || '').startsWith(d)); return i < 0 ? 9 : i; };
    const items = [...(pack.items || [])].sort((a, b) => dayRank(a.when) - dayRank(b.when));
    const n = items.filter(it => done[it.id]).length;
    document.getElementById('weekHead').innerHTML = `${esc(pack.title || '이번 주')}<br><span style="font-size:17px;font-weight:700;color:var(--muted)">${items.length}개 중 ${n}개 했어요</span>`;
    document.getElementById('progBar').style.width = (items.length ? n / items.length * 100 : 0) + '%';
    document.getElementById('weekIntro').textContent = pack.intro || '';
    let lastDay = null, html = '';
    for (const it of items) {
      const day = (it.when || '').replace(/\(.*\)/, '').trim() || '이번 주';
      if (day !== lastDay) { html += `<div class="day">${esc(it.when || day)}</div>`; lastDay = day; }
      const m = missing(it);
      const meta = done[it.id] ? '올림 완료' : m ? `채울 곳 ${m}개` : (it.channel === '이번 주 할 일' ? '눌러서 보기' : '바로 올릴 수 있어요');
      html += `<div class="task ${done[it.id] ? 'done' : ''}" data-id="${it.id}"><div class="ck">${done[it.id] ? '✓' : ''}</div><div style="flex:1"><span class="chip ${chipCls(it.channel)}">${esc(it.channel)}</span><div class="tt">${esc(it.title)}</div><div class="tm ${m && !done[it.id] ? 'need' : ''}">${meta}</div></div></div>`;
    }
    document.getElementById('taskList').innerHTML = html;
    document.querySelectorAll('.task').forEach(el => {
      el.querySelector('.ck').onclick = e => { e.stopPropagation(); done[el.dataset.id] = !done[el.dataset.id]; save('done', done); renderWeek(); };
      el.onclick = () => openItem(el.dataset.id);
    });
    document.getElementById('upd').textContent = DATA.updatedAt ? '마지막 갱신 ' + new Date(DATA.updatedAt).toLocaleString('ko-KR') : '';
  }

  function refHtml(id) {
    const p = byId[id]; if (!p) return '';
    const m = (p.analysis || {}).marketing || {};
    const who = p.source === 'youtube' ? '유튜브 ' + (p.account || '') : '@' + (p.account || '');
    const stat = p.source === 'youtube' ? `조회 ${(p.ytViews || 0).toLocaleString()}` : `좋아요 ${(p.likes || 0).toLocaleString()}${p.comments ? ' · 댓글 ' + p.comments.toLocaleString() : ''}`;
    return `<div class="ref"><div class="who">${esc(who)} · ${stat}</div>${(m.keypoints || []).length ? `<ul>${m.keypoints.slice(0, 4).map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}${m.hook ? `<div><span class="k">첫 줄</span> ${esc(m.hook)}</div>` : ''}${m.why ? `<div><span class="k">왜 통했나</span> ${esc(m.why)}</div>` : ''}${m.borrow ? `<div><span class="k">가져올 점</span> ${esc(m.borrow)}</div>` : ''}</div>`;
  }

  // --- item detail
  function openItem(id) {
    const it = (pack.items || []).find(x => x.id === id); if (!it) return;
    const isThread = it.channel === '스레드';
    const sl = slots(it.body);
    let i = -1;
    const bodyHtml = esc(it.body).replace(/\{\{([^}]+)\}\}/g, (m0, lab) => {
      i++; const s = sl[i]; const v = val(id, s.i);
      const ph = s.optional ? lab.replace(/^선택\s*[:：]\s*/, '') : lab;
      return `</div><textarea class="fill ${v ? 'ok' : ''}" data-i="${s.i}" rows="2" placeholder="${ph}">${esc(v)}</textarea>${s.optional ? '<div class="opt">선택 · 비워두면 이 줄은 빠져요</div>' : ''}<div class="draft">`;
    });
    document.getElementById('sheetInner').innerHTML = `
      <button class="back" id="backBtn">‹ 이번 주</button>
      <div><span class="chip ${chipCls(it.channel)}">${esc(it.channel)} · ${esc(it.when || '')}</span></div>
      <div class="big" style="font-size:19px;margin-top:8px">${esc(it.title)}</div>
      ${it.why ? `<div class="tip">💡 ${esc(it.why)}</div>` : ''}
      <div class="card"><div class="draft">${bodyHtml}</div>${isThread ? '<div class="count" id="cnt"></div>' : ''}</div>
      ${(it.basis || []).length ? `<details class="refs"><summary>참고한 글 ${it.basis.length}개 보기</summary>${it.basis.map(refHtml).join('')}</details>` : ''}`;
    const upd = () => {
      if (isThread) { const n = finalText(it).length; const c = document.getElementById('cnt'); c.textContent = `${n}자 / 500자`; c.classList.toggle('over', n > 500); }
      const m = missing(it); const cp = document.getElementById('cpBtn'); if (cp) cp.textContent = m ? `채울 곳 ${m}개 남음` : (done[id] ? '다시 복사' : '복사하고 완료');
    };
    document.querySelectorAll('#sheetInner .fill').forEach(t => t.oninput = () => { fills[id] = fills[id] || {}; fills[id][t.dataset.i] = t.value; save('fills', fills); t.classList.toggle('ok', !!t.value.trim()); upd(); });
    document.getElementById('backBtn').onclick = closeItem;
    const act = document.getElementById('actions');
    act.innerHTML = `${isThread ? '<button class="btn s" id="openBtn">스레드 열기</button>' : ''}<button class="btn p" id="cpBtn"></button>`;
    act.style.display = 'flex';
    document.getElementById('cpBtn').onclick = async () => {
      const m = missing(it); if (m) { const f = [...document.querySelectorAll('#sheetInner .fill')].find(t => !t.value.trim()); if (f) f.focus(); toast('노란 칸을 먼저 채워주세요'); return; }
      const text = finalText(it);
      try { await navigator.clipboard.writeText(text); } catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      done[id] = true; save('done', done); toast('복사했어요. 붙여넣기만 하면 돼요'); upd(); renderWeek();
    };
    const ob = document.getElementById('openBtn');
    if (ob) ob.onclick = () => { if (missing(it)) { toast('노란 칸을 먼저 채워주세요'); return; } window.open('https://www.threads.com/intent/post?text=' + encodeURIComponent(finalText(it)), '_blank'); };
    upd();
    document.getElementById('sheet').classList.add('on');
    document.getElementById('sheet').scrollTop = 0;
    history.pushState({ sheet: id }, '');
  }
  function closeItem() { document.getElementById('sheet').classList.remove('on'); document.getElementById('actions').style.display = 'none'; }
  window.addEventListener('popstate', closeItem);

  // --- learn view
  function renderLearn() {
    const rp = DATA.report;
    const edu = posts;
    const top = [...edu].sort((a, b) => (b.likes || 0) - (a.likes || 0))[0];
    document.getElementById('summary').innerHTML = `
      <div class="stat"><div><b>${edu.length}</b>모은 글</div><div><b>${top ? (top.likes || 0).toLocaleString() : '-'}</b>최고 좋아요</div><div><b>권위</b>반응 요인 1위</div></div>
      ${rp ? `<details class="card rep" style="margin-top:10px"><summary style="font-weight:700;cursor:pointer">${esc(rp.title || '이번 주 요약')}</summary>${(rp.sections || []).map(s => `<div style="margin-top:10px"><div style="font-weight:700;font-size:14px">${esc(s.h)}</div><ul style="margin:4px 0 0;padding-left:18px">${(s.items || []).map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</details>` : ''}`;
    document.getElementById('techList').innerHTML = (DATA.techniques || []).map(t => `<div class="tech"><h4>${esc(t.name)}</h4><div class="ex">${esc(t.how)} ${esc(t.why)}</div><div class="ours">우리 버전: ${esc(t.ours)}</div>${t.use ? `<div class="use">쓰기 좋은 곳: ${esc(t.use)}</div>` : ''}${(t.refs || []).length ? `<details class="refs"><summary>참고 글 ${t.refs.length}개</summary>${t.refs.map(refHtml).join('')}</details>` : ''}</div>`).join('') || '<div class="empty">아직 정리된 기법이 없어요</div>';
    document.getElementById('dontList').innerHTML = (DATA.donts || []).map(t => `<div class="tech dont"><h4>${esc(t.name)}</h4><div class="ex">${esc(t.why)}</div>${(t.refs || []).length ? `<details class="refs"><summary>예시 ${t.refs.length}개</summary>${t.refs.map(refHtml).join('')}</details>` : ''}</div>`).join('');
    const types = [...new Set(edu.flatMap(p => p.types || []))];
    let fType = '';
    const chips = document.getElementById('typeChips');
    chips.innerHTML = ['전체', ...types].map(t => `<button data-t="${t === '전체' ? '' : esc(t)}" class="${t === '전체' ? 'on' : ''}">${esc(t)}</button>`).join('');
    chips.querySelectorAll('button').forEach(b => b.onclick = () => { fType = b.dataset.t; chips.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); list(); });
    const list = () => {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const arr = edu.filter(p => (!fType || (p.types || []).includes(fType)) && (!q || [p.summary, p.caption, p.title, p.account, JSON.stringify((p.analysis || {}).marketing || {})].join(' ').toLowerCase().includes(q)))
        .sort((a, b) => (b.likes || 0) + (b.ytViews || 0) / 20 - (a.likes || 0) - (a.ytViews || 0) / 20);
      document.getElementById('postCount').textContent = `${arr.length}개`;
      document.getElementById('postList').innerHTML = arr.slice(0, 80).map(p => {
        const a = p.analysis || {}, m = a.marketing || {};
        const who = p.source === 'youtube' ? '유튜브 ' + (p.account || '') : (p.source === 'threads' ? '스레드 @' : '인스타 @') + (p.account || '');
        const stat = p.source === 'youtube' ? `조회 ${(p.ytViews || 0).toLocaleString()}` : `좋아요 ${(p.likes || 0).toLocaleString()}`;
        return `<div class="post"><div class="h">${esc(a.idea || p.summary || '')}</div><div class="who">${esc(who)} · ${stat}${(p.types || []).length ? ' · ' + esc(p.types.join(', ')) : ''}</div><details><summary>분석 보기</summary><div class="body">${(m.keypoints || []).length ? `<ul>${m.keypoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}${m.hook ? `<div><span class="k">첫 줄</span> ${esc(m.hook)}</div>` : ''}${m.structure ? `<div><span class="k">구조</span> ${esc(m.structure)}</div>` : ''}${m.cta ? `<div><span class="k">행동 유도</span> ${esc(m.cta)}</div>` : ''}${m.why ? `<div><span class="k">왜 통했나</span> ${esc(m.why)}</div>` : ''}${m.borrow ? `<div><span class="k">가져올 점</span> ${esc(m.borrow)}</div>` : ''}${a.promo && a.promo.hook && !/^\(|^-$/.test(a.promo.hook) ? `<div><span class="k">우리 헤드라인</span> ${esc(a.promo.hook)}</div>` : ''}${m.risk && m.risk !== '-' ? `<div><span class="k">주의</span> ${esc(m.risk)}</div>` : ''}${a.fact ? `<div><span class="k">정확한 사실</span> ${esc(a.fact)}</div>` : ''}<div style="margin-top:6px"><a href="${esc(p.url)}" target="_blank" style="color:var(--muted);font-size:12px">원문 열기</a></div></div></details></div>`;
      }).join('') || '<div class="empty">해당하는 글이 없어요</div>';
    };
    document.getElementById('q').oninput = list;
    list();
  }

  document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === b.dataset.v));
    window.scrollTo(0, 0);
  });
  renderWeek(); renderLearn();
};
if (window.IG_DATA) window.bootDashboard();
</script>
</body>
</html>
